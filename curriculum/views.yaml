# Curriculum views manifest — declares insider-gated pages available for this entity.
# Each view becomes a routable page at /<entity>/curriculum/<view-slug>.
# Adding a new view here requires zero router.js changes.
# Entities without this file (or with an empty views map) have no curriculum routes.

views:
  sights:
    label: Sights
    description: Track your progress through the Alice onboarding curriculum
    access: insider
